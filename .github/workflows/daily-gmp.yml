name: Daily IPO Signal

on:
  schedule:
    # Temporary: every 5 minutes (GitHub's minimum). Switch back to daily after testing.
    # Daily 9:00 AM IST = 3:30 AM UTC → cron: "30 3 * * *"
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-ipo-signal
  cancel-in-progress: false

jobs:
  post-signal:
    runs-on: ubuntu-latest
    # Secrets live in Settings → Environments → TELEGRAM_BOT_TOKEN
    environment: TELEGRAM_BOT_TOKEN
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Post IPO signal to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          MIN_GAIN_PCT: ${{ vars.MIN_GAIN_PCT }}
        run: python -m src.main
